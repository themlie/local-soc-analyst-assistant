name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The ingest, detection and validation layers are pure standard library, so CI
      # deliberately does not install the on-device model runtime: it would add
      # minutes and a platform dependency without exercising a line these tests reach.
      # Anything that needs a model is measured locally (see eval/grounding_eval.py).
      # numpy is needed because retrieval computes vector similarity; the model
      # runtime still is not, since chunking and the refusal path never load a model.
      - name: Install test dependencies
        run: python -m pip install --quiet pytest numpy

      - name: Regression tests
        run: python -m pytest tests/ -q

      # A gate, not a report: the build fails if a change quietly makes detection
      # worse. Floors sit just under the current numbers (100% / 92.86%) so ordinary
      # noise does not fail the build, but a real regression does.
      - name: Detection accuracy
        run: python -m eval.evaluate --min-precision 0.95 --min-recall 0.90
